A personal financial-interface concept built with **React, TypeScript and reusable design-system components**. One ledger page makes amounts, fees, refunds and recovery states inspectable.

![Ledger Console dark theme](docs/validation/ledger-dark.jpg)

**Concept only:** all 42 transactions and counterparties are fictional. No payments, wallet connections or real authentication are performed. No client delivery, production adoption or business uplift is claimed.

## Try it

Download **[Ledger Console.html](Ledger%20Console.html)** and open it in a browser. The complete JavaScript and CSS are embedded; no server or installation is needed. Theme persistence depends on the browser's local-file storage policy.

The header switches dark/light mode, English/Arabic and the local error scenarios. Search or filter the ledger, open a row to inspect its timeline, and compare full or partial refund breakdowns.

## What is implemented

See the [role-aligned delivery index](docs/DELIVERABLES.md) for all seven requested artifacts, the [component guide](docs/COMPONENT_GUIDE.md) for usage rules and Figma references, and the [internationalization / accessibility guide](docs/I18N_ACCESSIBILITY.md) for the review matrix.

- Search, status/currency filters and sorting that groups currencies without implying FX conversion.
- Explicit ISO currency codes, integer minor-unit totals, decimal tie rounding and safe-value checks.
- Full/partial refunds with separate principal return, fee return, refund credit and remaining net debit.
- Loading, filtered-empty, network-error, permission-denied and expired-session states with local recovery.
- English/Arabic, RTL, bidirectional money isolation and visible UTC timestamps.
- Shared dark/light component contracts, 44px core controls and a keyboard-managed details drawer.
- A 78-token generator and Storybook component examples.
- Inspectable persistent loading, no-data and long-text scenarios in the header.
- Storybook form validation, disabled controls, blocked states and a shared theme toolbar.

## Run the source

Use Node.js 22.18+ (or Node.js 24) and npm. Install development dependencies yourself with \`npm ci\`, then:

\`\`\`sh
npm run dev
npm run build
npm test
npm run storybook
npm run build-storybook
\`\`\`

\`npm run build\` checks TypeScript, generates tokens, creates \`dist/\`, and exports both \`Ledger Console.html\` and \`docs/index.html\` as standalone builds. \`Start Preview.bat\` serves the built app; \`Start Storybook.bat\` starts the component catalogue when dependencies are installed.

## Design decisions and evidence

### Interactive article examples

Each of the five visible delivery sections has a runnable window: responsive components,
token overrides, the actual Storybook catalogue, boundary
states, and locale/RTL access. The four focused
React examples reuse production components from this repository; Storybook is the
fifth window. English/Chinese article preferences are sent to the examples
without resetting their interaction state. The locale example also supports Arabic.

The Design tokens section includes a visual design-system board. Its swatches,
values and copy actions read the ledger's active CSS variables, including theme
surfaces, Select colors and interaction states. The unused legacy palette stays
hidden; the displayed count reflects the current catalogue, not all 78 JSON entries.
The board also shows typography, spacing, radii, motion and layers. All 13 shared
components render directly from \`src/components/\`. The States section shows 18
button/input specimens plus a live validation and Select example. Its pinned
hover, pressed and focus states share CSS with native interactions, and the same
catalogue is available in Storybook under Components/Interaction states.
Catalogue typography uses the existing 22px page title, 18px section title,
14px group heading and 12px label/value tokens. The duplicate display title is
removed; typography specimens retain their actual source sizes and weights.
Use its section navigation or open
\`projects/ledger-console/examples.html?example=system&lang=en\` in the portfolio.

\`npm run build\` exports \`docs/article-examples.html\` after the main ledger build.
\`npm run build-storybook\` exports the actual catalogue. Rebuild article markup with
\`npm run build:article-visuals\`, then sync to the portfolio. The iframe windows load
only near the viewport and offer a separate-tab link. Tokens, forms, recovery,
checklists and downloads are local previews; nothing is submitted or published.

- [Case study](docs/CASE_STUDY.md)
- [Implementation handoff](docs/IMPLEMENTATION_HANDOFF.md)
- [Validation and limits](docs/VALIDATION.md)
- [Audit and remediation](docs/UI_AUDIT_EN.md)

The visual treatment adapts selected controls from a supplied Figma library: Button 22:25906 / 22:26058, Input 22:26741 and TableHeader 110:21982. The ledger composition, financial rules, accessibility behavior and light theme are concept-specific implementation decisions. This is a documented, source-inspired mapping, not a complete or automatically synchronized Figma system. Font rendering uses a local fallback when the source font is unavailable.

## Keep the portfolio article in sync

The article source is \`docs/portfolio.json\`. After editing it or rebuilding the demo, run:

\`\`\`sh
node scripts/sync-portfolio.mjs --portfolio /path/to/portfolio_01
\`\`\`

This updates the independent article module, the standalone demo and four selected screenshots. It does not rewrite other project articles. The existing portfolio shell registers the new entry once; subsequent updates only replace Ledger Console's own files.

## Financial boundaries

The six fixture currencies all use two decimals. Decimal midpoint values round away from zero before integer-unit addition. Currency grouping is not FX conversion. The refund policy retains original fees and is explicitly illustrative. Real financial records, permissions, refund policies and transaction execution belong to a production service and are outside this prototype.

Native-speaker review, comprehensive screen-reader testing and task-based usability research remain future validation work. No automatic Figma Code Connect, visual-regression coverage or complete WCAG certification is claimed.

\r
A single ledger page connects the following seven deliverables. The 42 transactions are fictional; no real account is connected and no funds move. This is an implementation study, not a client production release.\r
\r
| File / artifact | Role requirement |\r
| --- | --- |\r
| React + TypeScript page and components | Code delivery, reusable components and responsive layout |\r
| Design tokens | Color, typography, spacing and radius foundations |\r
| Component and state examples | Amounts, currencies, fees, statuses, tables, filters and forms |\r
| Storybook and component documentation | Variants, usage rules and documented Figma ↔ React references |\r
| Boundary-state examples | Loading, no data, errors, long text and permission restrictions |\r
| Internationalization and accessibility | Multiple currencies, local formats, keyboard access and RTL |\r
| English case study and README | Problem, decisions, implementation, validation and handoff |\r
\r
## React + TypeScript page and components\r
\r
A dense ledger needs a clear scan path and a predictable way to inspect a record. The page composes Button, Input, Select, FilterBar, MoneyText, StatusBadge, TransactionTable and TransactionDrawer instead of implementing each state separately.\r
\r
Implementation: src/App.tsx owns filters, currency-grouped sorting, request states and selection. Components live in src/components/. On narrow screens, the table scrolls inside a labelled region; the details drawer supports keyboard focus and return. The TypeScript/Vite build produces a standalone Ledger Console.html for review.\r
\r
\r
## Design tokens\r
\r
The foundation covers semantic colors, typography, spacing, radii and motion. tokens/tokens.json is the source for 78 base tokens; scripts/build-tokens.mjs emits CSS custom properties and typed TypeScript references. Generated files are rebuilt rather than edited by hand.\r
\r
Dark and light modes share component contracts. The dark foundation is generated from JSON, while light-mode and additional surface overrides are maintained in src/styles/themes.css. Moving both modes into one generated token graph remains a handoff improvement.\r
\r
\r
## Component and state examples\r
\r
MoneyText shows ISO currency codes and local grouping. Amounts and fees are normalized to integer minor units before totals; decimal midpoint values round away from zero. Sorting groups currencies and does not imply FX conversion. StatusBadge pairs text with an icon rather than relying on color alone.\r
\r
The drawer separates original debit, principal returned, fee returned, refund credit and remaining net debit. Full and partial refunds use an explicitly illustrative policy that retains original fees. Filter examples cover search, status and currency; the Controls story adds labelled fields, required validation, inline errors and disabled controls without sending or saving data.\r
\r
\r
## Storybook and component documentation\r
\r
src/stories/ makes component variants reviewable in Storybook, including monetary edge cases, statuses, active filters, long text, full/partial refunds, form validation and blocked states. The shared toolbar switches dark and light mode. Usage contracts and review paths are recorded in docs/COMPONENT_GUIDE.md and docs/DELIVERABLES.md.\r
\r
The Figma ↔ React relationship is documented rather than implied: Button references 22:25906 / 22:26058, Input references 22:26741, and the table-header treatment references 110:21982 in the supplied library. Ledger-specific components and interaction rules are implementation decisions. No complete library parity, Code Connect registration or automatic synchronization is claimed.\r
\r
\r
## Boundary-state examples\r
\r
The header exposes persistent loading, no transactions, long text, network error, permission denial and expired session. A search with no match shows a separate filtered-empty state with a clear-filters action. Loading remains inspectable until another demo state is selected.\r
\r
Blocked states hide transaction rows and filters. Local recovery restores fixture data while preserving filter selections; it does not authenticate a user or grant access. Long names and unbroken references wrap without truncating the identifier. These patterns are also isolated under Patterns/Boundary states in Storybook.\r
\r
\r
## Internationalization and accessibility\r
\r
The ledger supports English and Arabic, with automatic RTL when Arabic is selected. Currency codes remain explicit, numbers use the documented Latin-digit convention, bidirectional isolation protects identifiers, and dates are consistently labelled UTC. All six fixture currencies use two decimals; the MoneyText examples additionally exercise zero- and three-decimal formats.\r
\r
Keyboard support includes a skip link, visible focus, native controls, result-count announcements, Enter/Space to open a row, and a drawer with Tab containment, Escape and focus return. Core targets are at least 44px. docs/I18N_ACCESSIBILITY.md records the review matrix and remaining native-speaker and assistive-technology checks; no WCAG certification is claimed.\r
\r
\r
## English case study and README\r
\r
docs/CASE_STUDY.md explains the problem, design decisions and implementation. README.md covers setup and the standalone build; docs/IMPLEMENTATION_HANDOFF.md records entry points and contracts; docs/VALIDATION.md records checks and limits. The seven deliverables are indexed in docs/DELIVERABLES.md so another designer or engineer can continue the work.\r
\r
TypeScript/Vite and Storybook production builds pass, alongside seven automated money/refund tests. Browser checks cover recovery, long text, form validation and a 390px Arabic/RTL/light layout with no page overflow. These are implementation checks, not user-research findings or measured business uplift. Production use still needs server-owned financial records, authenticated access and provider-approved refund rules.\r
\r
## Review and handoff\r
\r
The portfolio article includes a visual design-system board with all 78 source tokens and 13 shared components, a refund calculation explorer, and expandable boundary-state contracts. The board uses color swatches, type specimens, spacing bars, radius shapes, motion previews and layer samples; its component gallery uses the actual React components. The refund explorer reads fixtures \`tx-015\` (partial, EUR) and \`tx-008\` (full, USD) from the source dataset. It keeps the records separate and preserves the illustrative fee-retention rule. Its native radio controls and disclosures work without additional JavaScript.\r
\r
\`npm run build:article-visuals\` rebuilds the bilingual visual markup in \`docs/portfolio.json\`. Styling lives in \`docs/article-visuals.css\`; the sync scripts copy it to the portfolio's \`assets/ledger-console/article-visuals.css\` with the article.\r
\r
Start with [the deliverable index](DELIVERABLES.md), then follow the component and accessibility guides. Native-speaker review, comprehensive screen-reader testing and task-based usability research remain future work. The source-inspired Figma mapping is documented; no automatic synchronization is claimed.\r
`,"docs/COMPONENT_GUIDE.md":`# Component contracts and Figma references

## Foundations

Use semantic CSS variables rather than literal status colors in domain components. Generate CSS/TypeScript from \`tokens/tokens.json\`; never edit generated output. Shared light/dark overrides are in \`src/styles/themes.css\`. Inspect either mode using the Storybook toolbar. Layout uses logical properties so RTL remains independent of color mode.

The design-system board reads effective \`--lc-*\` values from the active root styles, including additions in \`themes.css\`. Swatches and copied declarations follow the current theme. The legacy \`color.palette.*\` inventory is omitted from the visible catalogue. FilterBar and ErrorState use their shared production styles without specimen-only appearance overrides.

Catalogue headings follow one token hierarchy: page title 22px/600, section title 18px/600, group heading 14px/500, label or technical value 12px/400. There is one main title. Font-size and weight specimens deliberately retain their actual token values; production component specimens retain their shared component styles.

## Component inventory

| React component | Variants and usage rules | Storybook | Figma relationship |
| --- | --- | --- | --- |
| Button | Primary/secondary; default, hover, pressed, focus, disabled, loading; explicit type; at least 44px target; loading blocks duplicate actions and exposes aria-busy | Components/Controls; Components/Interaction states | Source-inspired Button \`22:25906\` / \`22:26058\` |
| Input / Select | Visible labels; input validation and inline errors; disabled controls; Select supports arrows, Home/End, typeahead, Enter, Escape and Tab | Components/Controls; Components/FilterBar | Input adapts \`22:26741\`; Select adapts \`22:26860\`, \`22:26875\` and \`22:26893–26902\` |
| MoneyText | ISO code, local grouping, tabular figures, invalid-value fallback; never add unlike currencies | Components/MoneyText | Concept-specific; no mapped Figma component |
| StatusBadge | Five statuses, each with words and an icon; color is supplemental | Components/StatusBadge | Concept-specific |
| FilterBar | Search, status selection, currency selection, clear filters; controlled state | Components/FilterBar | Composition using the input/button treatment; no full variant parity claimed |
| TransactionTable | Compact 12×16px paired chevrons and aria-sort; currency-grouped amount order; long text wraps; narrow view scrolls within its own region | Components/TransactionTable | Header treatment adapts \`110:21982\`; sorting uses a code-drawn chevron indicator; ledger composition is concept-specific |
| TransactionDrawer | Timeline; settled/failed/full or partial refund; focus containment, Escape and focus return | Components/TransactionDrawer | Concept-specific |
| Loading / Empty / Error | Distinguish no data from no matches; distinguish network, access and session problems; expose no rows while blocked | Patterns/Boundary states | Concept-specific |

Source library: [supplied Figma file](https://www.figma.com/design/3BZDsAEpiSX4B7sgqLltD7/Shell-mobile--Copy-?node-id=22-23675).
Select, SelectOption, table-header and arrow references were inspected in the supplied Figma file for the control refinement. The Select uses a pill trigger, a 4px popup gap, 16px panel corners and violet active text. Its listbox is portalled and positioned within the viewport; focus remains on the labelled combobox. Pointer targets are at least 44px. Original 24px chevrons are stored in \`src/assets/figma/\` and bundled locally for Select; table sorting uses a compact code-drawn icon. Currency labels are supplied by the ledger; the reference component's crypto logo is not used for fiat currencies. No Figma edits, automatic synchronization or Code Connect registration were performed. Proposed variables are documented in [the token mapping](figma-variables-mapping.md).

## Financial contract

Each displayed amount carries its currency. Amount and fee are distinct; original debit adds their minor units. Refund credit adds returned principal and returned fee. Remaining net debit subtracts that credit. The illustrative policy retains original fees. All six ledger currencies use two decimals; the formatter also demonstrates zero- and three-decimal currencies in Storybook. Rounding happens before addition. Financial records and policies must be supplied and validated by a production service.

## Form contract

Control focus uses one continuous 2px edge, with no separated outer ring or layout shift. Buttons use the current text color; inputs retain the semantic focus color and Select uses its own text color. Native keyboard focus and pinned specimens share these rules in both themes.

The Controls story demonstrates required reference validation with a real form submit, \`aria-invalid\`, \`aria-describedby\`, inline errors and disabled controls. It sends and saves nothing. The ledger uses these controls for filtering; there is no payment or refund execution form.

The board and Interaction states story render 12 button states and six input states. \`data-preview-state\` pins a catalogue specimen; native pseudo-classes and pinned states are grouped in the same shared CSS declarations. Preview click counters, live validation and Select changes remain local. A loading Button is disabled, shows a spinner, and has \`aria-busy="true"\`.

## Handoff rules

Keep product states in the page, formatting in MoneyText/money.ts and translations in i18n.tsx. Add variants to Storybook when a component contract changes. Check both themes, narrow view, long text and RTL. Never infer successful payment, authentication or permission changes from a local recovery action.
`,"docs/I18N_ACCESSIBILITY.md":`# Internationalization and accessibility review guide\r
\r
## Implemented behavior\r
\r
- English and Arabic labels include filters, recovery, status names, timeline notes and the demo-state selector. Switching to Arabic sets document language and RTL; switching back to English restores LTR.\r
- Money uses Intl formatting with ISO currency codes and bidirectional isolation. Arabic currently uses Latin digits by deliberate demo convention. Names and references remain fixture content and are isolated using \`bdi\`.\r
- Dates are formatted for the selected locale with an explicit UTC label. There is no user-timezone preference in this prototype.\r
- Long counterparties and unbroken references wrap without truncating identifiers. The table retains horizontal scrolling within a labelled, keyboard-focusable region on narrow screens.\r
- Native controls have visible labels and a 44px minimum target. Status words and icons supplement colors. Visible focus, a skip link, polite result-count announcements and reduced-motion handling are provided.\r
- Rows open using Enter or Space. The details drawer contains Tab navigation, closes with Escape and restores focus to its invoking row. Loading exposes a busy status; errors use alerts.\r
\r
## Manual review matrix\r
\r
| Task | Expected behavior |\r
| --- | --- |\r
| Tab from page start | Skip link and controls have visible focus and a logical order |\r
| Change filters | Updated result count is announced without interrupting each keystroke |\r
| Enter / Space on a row | Drawer opens; Tab stays within it; Escape returns to the row |\r
| Select permission denied or expired session | No transaction rows or filters remain exposed; action explains local recovery |\r
| Choose persistent loading | Skeleton remains inspectable; the header still permits selecting Normal |\r
| Choose no transactions vs an unmatched query | Distinct explanations; only filtered empty offers clear filters |\r
| Choose long text at a narrow width | Full names and references remain available; page-level overflow is avoided |\r
| Arabic + RTL + light/dark | Labels mirror, identifiers remain readable and money retains an explicit currency |\r
| Submit an empty Controls story | The error is linked to the input and is announced; disabled form is inert |\r
\r
This is a review checklist, not a claim that every task has been retested in every browser. Native-speaker proofreading, assistive-technology testing, zoom/high-contrast coverage and broader locale testing remain open. See VALIDATION.md for recorded checks. No WCAG certification is claimed.\r
`,"docs/IMPLEMENTATION_HANDOFF.md":"# Ledger Console implementation handoff\r\n\r\n## Scope\r\n\r\nOne personal concept ledger page. Fictional data, no payment execution, wallet integration, real authentication or production customer results.\r\n\r\n## Entry points\r\n\r\n- `src/App.tsx`: page state, filters, sorting and selection.\r\n- `src/data/transactions.ts`: 42 deterministic fixtures, six currencies, full/partial refund data.\r\n- `src/data/api.ts`: local network/permission/session state simulation.\r\n- `src/money.ts`: decimal normalization and integer minor-unit addition.\r\n- `src/i18n.tsx`: English and Arabic labels and timeline content.\r\n- `src/styles/themes.css`: light-mode semantic overrides and shared surfaces.\r\n- `tokens/tokens.json`: base token source; generated CSS/TS must be rebuilt with `npm run build`.\r\n- `.storybook/`: component catalogue configuration.\r\n- `docs/DELIVERABLES.md`: all seven role-aligned deliverables and the review walkthrough.\r\n- `docs/COMPONENT_GUIDE.md`: variants, financial/form contracts and honest Figma reference coverage.\r\n- `docs/I18N_ACCESSIBILITY.md`: locale conventions and keyboard / RTL review matrix.\r\n\r\n## Contracts\r\n\r\nMoney values are display/demo data, never instructions to execute a payment. All fixture currencies use two decimals. Refund credit equals principal returned plus fee returned; net debit equals original debit minus refund credit. The demo retains original fees. All dates display UTC. Currency sorting groups codes and does not perform FX conversion.\r\n\r\nThe drawer traps focus, supports Escape and restores the selected row. Statuses include text and icons. Blocked states suppress rows and filters. Recovery resets the local demo scenario and retains the user's filters.\r\n\r\nThe header also provides no-data, persistent-loading and long-text scenarios. Persistent loading is held in page state without leaving a request pending; choosing another scenario exits it. The Controls Storybook example demonstrates validation only and is not an execution form. Both themes are available through the Storybook toolbar.\r\n\r\n## Build and delivery\r\n\r\n`npm run build` regenerates tokens, checks TypeScript, builds the app, and emits both `Ledger Console.html` and `docs/index.html`. Both HTML files inline the same built JavaScript and CSS. `npm test` runs the money/refund checks. `npm run build-storybook` builds the component catalogue when development dependencies are installed.\r\n\r\n`node scripts/sync-portfolio.mjs --portfolio /path/to/portfolio_01` updates only the Ledger Console article module, demo and selected screenshots in that portfolio. Its article source is `docs/portfolio.json`; other project articles are not rewritten.\r\n\r\n## Verification limits\r\n\r\nSee `VALIDATION.md` and `UI_AUDIT_EN.md`. No production financial, legal, comprehensive accessibility or business-impact claim is implied by the demo.\r\n","docs/VALIDATION.md":`# Verification record — 25 October 2026\r
