<!doctype html>
<html lang="en" dir="ltr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ledger Console built with the supplied Figma component system." />
    <script>
      try {
        const theme = localStorage.getItem('ledger-console-theme');
        document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark';
      } catch { /* Keep the default dark theme. */ }
    </script>
    <title>Ledger Console</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
